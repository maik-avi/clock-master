<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Temps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>

    <section class="launcher" aria-labelledby="launcher-title">

      <h1 id="launcher-title" class="launcher-title">
        Hello TimeMaster...
      </h1>
      
      <nav>
        <ul class="tool-grid">
          <li>
            <a href="#clock" class="tool-card">
              <span
                class="material-icons">
                schedule
              </span>
              <span>Rellotge</span>
            </a>
          </li>

          <li>
            <a href="#alarm" class="tool-card">
              <span
                class="material-icons">
                alarm
              </span>
              <span>Alarm</span>
            </a>
          </li>
          <li>
            <a href="#timer" class="tool-card">
              <span
                class="material-icons">
                hourglass_top
              </span>
              <span>Timer</span>
            </a>
          </li>
          <li>
            <a href="#stopwatch" class="tool-card">
              <span
                class="material-icons">
                timer
              </span>
              <span>Stopwatch</span>
            </a>
          </li>
        </ul>
      </nav>


    </section>
    
    <main>
      <section id="clock" class="tool-view">

        <h2 id="clock-title" class="view-title">
          Rellotge
        </h2>

        <x-clock>
          <time>00:00:00</time>
        </x-clock>
      </section>


      <section id="alarm" class="tool-view">

        <h2 id="alarm-title" class="view-title">
          Alarmes
        </h2>

        <x-alarm>

          <template>

            <section class="alarms">

              <input type="time" min="00:00" max="23:59" step="1" />

              <section class="controls">
                <button type="button" class="start material-icons">alarm_on</button>
                <button type="button" class="pause material-icons">alarm_off</button>
                <button type="button" class="delete material-icons">delete</button>
              </section>
            </section>
          </template>
          <section class="items"></section>
          <section class="controls">
            <button class="add material-icons">add_alarm</button>
          </section>
        </x-alarm>
      </section>
      <section id="stopwatch">
        <x-stopwatch>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="controls">
            <div class="items"></div>

          <div class="controls">
            <button
              type="button"
              class="add material-icons">
              add_alarm
            </button>
          </div>
          </section>
        </x-stopwatch>
      </section>

      <section id="timer" class="tool-view">

        <h2 id="timer-title" class="view-title">
          Temporitzador
        </h2>
        <x-timer>
          <time datetime="PT0S">00:00:00.00</time>
          <section class="items">
            <section class="timers">
              <input
                type="time"
                min="00:00:00"
                max="23:59:59"
                value="00:03:00"
                step="1"
              />
              <input
                type="time"
                min="00:00:00"
                max="23:59:59"
                value="00:01:00"
                step="1"
              />
            </section>
          </section>
          <div class="controls">
            <button type="button" class="start material-icons">timer</button>
            <button type="button" class="pause material-icons">timer_off</button>
            <button type="button" class="restart material-icons">restart_alt</button>
            <button type="button" class="loop material-icons">loop</button>
            <button type="button" class="no-loop material-icons">sync_disabled</button>
          </div>
        </x-timer>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
